<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
  <title id="t">Duas mulheres se abraçando</title>
  <desc id="d">Ilustração acolhedora em tons de rosa: duas mulheres se abraçam sob um coração e flores.</desc>
  <rect width="640" height="400" fill="#fff6f9"/>
  <circle cx="320" cy="210" r="170" fill="#f9cfdd"/>
  <path d="M320 120c-18-34-70-22-70 18 0 36 40 58 70 82 30-24 70-46 70-82 0-40-52-52-70-18z" fill="#7a1245" transform="translate(0 -40) scale(1)"/>
  <!-- figura esquerda -->
  <circle cx="255" cy="215" r="30" fill="#3b0a24"/>
  <circle cx="255" cy="222" r="22" fill="#e9b79c"/>
  <path d="M215 330c0-48 18-80 40-80s40 32 40 80z" fill="#5a1a3a"/>
  <!-- figura direita -->
  <circle cx="385" cy="215" r="30" fill="#6b3a1f"/>
  <circle cx="385" cy="222" r="22" fill="#c98a63"/>
  <path d="M345 330c0-48 18-80 40-80s40 32 40 80z" fill="#7a1245"/>
