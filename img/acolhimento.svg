  <!-- flores -->
  <g fill="#fff6f9" stroke="#5a1a3a" stroke-width="3">
    <circle cx="90" cy="320" r="14"/><circle cx="130" cy="340" r="10"/><circle cx="550" cy="320" r="14"/><circle cx="510" cy="345" r="10"/>
  </g>
